# Verificación de cada PR hacia development y hacia main.
#
# Corre lo mismo que se corre en local (`npm test`, `npm run lint`,
# `npm run typecheck`) para que un PR no pueda romper la rama sin que se vea.
# Todo en un solo job: son pasos de segundos y comparten el `npm ci`, así que
# separarlos solo haría instalar las dependencias tres veces.
#
# `main` está acá porque un release es un PR de development hacia main, y sin
# este trigger ese PR no traía ningún check propio: heredaba el run verde del
# tip de development, que es el mismo commit pero no es lo mismo que haberlo
# verificado contra main. Pasó en el release #59.

name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

# Un PR que recibe varios pushes seguidos cancela sus corridas anteriores.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tests, lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # `npm ci` y no `npm install`: respeta el lockfile y falla si está
      # desincronizado con los package.json, que es justo lo que se quiere saber.
      - name: Instalar dependencias
        run: npm ci

      - name: Tests de la API
        run: npm test

      - name: Lint de web
        run: npm run lint

      - name: Tipos de mobile
        run: npm run typecheck

      # mobile/global.css se genera desde los tokens: si alguien lo editó a
      # mano, o cambió un color y no volvió a generarlo, acá se ve.
      - name: Variables CSS al día con los tokens
        run: npm run tokens:css:check

      - name: Tailwind escanea todas las carpetas con clases
        run: npm run tailwind:content:check
